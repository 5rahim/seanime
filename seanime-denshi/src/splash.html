<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="#070707" name="theme-color">
    <title>Seanime</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #070707;
            color: #f4f4f5;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            user-select: none;
            -webkit-app-region: drag;
        }

        .bg {
            position: fixed;
            inset: 0;
            opacity: 0;
        }

        .event .bg {
            background: url("../assets/splash-bg.jpg") center 70% / cover no-repeat;
            filter: saturate(0.8);
            opacity: 0.22;
            animation: enter 1.2s ease-out both;
        }

        .event .bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 40% 45% at 50% 50%, rgba(7, 7, 7, 0.7), transparent),
            linear-gradient(#070707, transparent 45%, transparent 75%, #070707);
        }

        .splash {
            position: relative;
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            animation: enter 400ms ease-out both;
        }

        .logo {
            width: 72px;
            height: 72px;
        }

        .bar {
            position: relative;
            width: 112px;
            height: 2px;
            overflow: hidden;
            border-radius: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        .bar::after {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 36px;
            border-radius: 1px;
            background: #9f92ff;
            animation: slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }

        .version {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            color: rgba(244, 244, 245, 0.28);
        }

        @keyframes enter {
            from {
                opacity: 0;
            }
        }

        @keyframes slide {
            to {
                transform: translateX(76px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .splash {
                animation: none;
            }

            .bar::after {
                animation-duration: 2.4s;
            }
        }
    </style>
</head>

<body>
<div aria-hidden="true" class="bg"></div>
<main aria-label="Seanime is starting" class="splash">
    <img alt="Seanime" class="logo" src="../assets/512x512.png">
    <div aria-hidden="true" class="bar"></div>
</main>
<div class="version" id="version"></div>
<script>
    const version = new URLSearchParams(location.search).get("version")
    if (version) document.getElementById("version").textContent = "v" + version

    if (Date.now() < new Date(2026, 10, 23).getTime()) document.body.classList.add("event")
</script>
</body>

</html>
